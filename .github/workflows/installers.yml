name: Installers

# Builds the three downloads with the scripts in build/installers/ (see docs/installers.md):
#   Windows Setup.exe · macOS universal .pkg · Linux AppImage
# Run it from the Actions tab ("Run workflow") to get them as workflow artifacts, or push a tag v<version>
# (matching version.json) to also attach them to a draft GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build Setup.exe
        shell: pwsh
        run: ./build/installers/windows/build-setup.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: artifacts/installers/*.exe
          if-no-files-found: error

  macos:
    name: macOS universal .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build .pkg
        run: bash build/installers/macos/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-universal
          path: artifacts/installers/*.pkg
          if-no-files-found: error

  linux:
    name: Linux AppImage
    # The oldest supported Ubuntu: the AOT binary needs the build machine's glibc (2.35) or newer,
    # so building here keeps the AppImage running on most distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Native AOT and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev xvfb
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: bash build/installers/linux/build-appimage.sh x64

      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux-x64
          path: artifacts/installers/*.AppImage
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches version.json
        run: |
          version=$(sed -nE 's/.*"version"[[:space:]]*:[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' version.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.json ($version)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      # install.sh / install.ps1 refuse a download that doesn't match this file.
      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Stays a draft until you publish it on GitHub; the install scripts only see published releases.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "DevToolBox ${GITHUB_REF_NAME#v}" \
            --generate-notes
